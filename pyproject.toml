[tool.poetry]
name = "my_fastapi_project"
version = "0.1.0"
description = "FastAPI project with Google OAuth2, JWT auth, async SQLAlchemy"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
python-dotenv = "^1.0.1"

# --- Database ---
sqlalchemy = "^2.0.29"
asyncpg = "^0.29.0"
alembic = "^1.13.1"

# --- Async ---
aiohttp = "^3.9.3"

# --- Security ---
python-jose = "^3.3.0"
passlib = "^1.7.4"
bcrypt = "^4.1.2"

# --- Utils ---
pydantic = "^2.6.4"
pydantic-settings = "^2.3.1"

[tool.poetry.group.dev.dependencies]
black = "^24.3.0"
isort = "^5.13.2"
pytest = "^8.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
