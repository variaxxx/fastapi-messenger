[project]
name = "fastapi-messenger"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.121.3,<0.122.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "python-jose[pycryptodome] (>=3.5.0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "ruff (>=0.14.6,<0.15.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "pydantic (>=2.12.4,<3.0.0)",
    "boto3 (>=1.41.4,<2.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "pillow (>=12.0.0,<13.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 80

[tool.ruff.lint]
extend-select = ["W", "E", "I"]
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"